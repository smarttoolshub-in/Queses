<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Math Hub - Nested Menu Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            color: #333;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background: #1e3c72;
            color: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #2a5298;
            padding-bottom: 10px;
        }
        .class-btn {
            display: block;
            width: 100%;
            background: #2a5298;
            color: white;
            border: none;
            padding: 11px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
        }
        .class-btn:hover, .class-btn.active {
            background: #ff9800;
            color: #fff;
            font-weight: bold;
        }

        /* Dropdown Sub-menu for Competitive Exams */
        .dropdown-btn {
            background: #162b50;
            border-left: 4px solid #ff9800;
        }
        .sub-menu {
            display: none;
            padding-left: 15px;
            margin-bottom: 8px;
        }
        .sub-menu .class-btn {
            background: #244682;
            font-size: 13px;
            padding: 8px 12px;
            margin-bottom: 5px;
        }

        /* Main Content Styling */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            overflow-y: auto;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }
        .timer {
            background: #ff4757;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
        }
        .level-badge {
            display: inline-block;
            background: #1e3c72;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .question {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #f1f3f5;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: 0.3s;
        }
        .options button:hover:not(:disabled) {
            background: #e2e6ea;
            border-color: #1e3c72;
        }
        .options button.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }
        .options button.wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        /* Explanation Box */
        #explanation-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            border-left: 5px solid #1e3c72;
        }
        .correct-bg { background: #d4edda; border-left-color: #28a745; color: #155724; }
        .wrong-bg { background: #f8d7da; border-left-color: #dc3545; color: #721c24; }

        .next-btn {
            display: none;
            width: 100%;
            padding: 12px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .next-btn:hover { background: #162b50; }
        
        .score-card { text-align: center; display: none; }
        .placeholder-text { text-align: center; color: #666; font-size: 18px; margin-top: 50px; }

        /* Responsive for Mobile */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                display: flex;
                overflow-x: auto;
                padding: 10px;
                white-space: nowrap;
            }
            .sidebar h2 { display: none; }
            .class-btn {
                display: inline-block;
                width: auto;
                margin-right: 10px;
                margin-bottom: 0;
            }
            .sub-menu { display: flex; padding-left: 0; }
            .sub-menu .class-btn { display: inline-block; width: auto; margin-right: 10px; }
            .main-content { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <div class="sidebar" id="sidebar">
        <h2>📚 Math Hub</h2>
        <!-- School Classes will be inserted here -->
        
        <!-- Competitive Exams Dropdown Container -->
        <button class="class-btn dropdown-btn" onclick="toggleCompMenu()">🎯 Competitive Exams ▾</button>
        <div class="sub-menu" id="comp-submenu">
            <!-- 19 Chapters will be inserted here -->
        </div>
    </div>

    <!-- Main Quiz Content -->
    <div class="main-content">
        <div class="container" id="quiz-container-main" style="display: none;">
            
            <div class="top-bar">
                <span id="progress-text">सवाल: 1 / 5</span>
                <span class="timer" id="timer">⏱️ 15s</span>
            </div>

            <div id="level-badge" class="level-badge">Category Name</div>
            <div id="question" class="question">सवाल यहाँ लोड हो रहा है...</div>
            
            <div class="options" id="options-box"></div>
            <div id="explanation-box"></div>
            
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">अगला सवाल ➡️</button>
        </div>

        <!-- Initial Placeholder Message -->
        <div class="container" id="welcome-msg">
            <h2 style="color: #1e3c72; text-align: center;">👋 Welcome to Math Hub!</h2>
            <p class="placeholder-text">कृपया बायीं तरफ से कोई भी <b>Class</b> या <b>Competitive Chapter</b> चुनें और क्विज़ शुरू करें।</p>
        </div>

        <!-- Score Card -->
        <div class="container score-card" id="score-card">
            <h2>क्विज़ समाप्त! 🎉</h2>
            <p id="final-score" style="font-size: 18px; margin: 15px 0;"></p>
            <button class="next-btn" style="display: block;" onclick="restartCategory()">दोबारा खेलें 🔄</button>
        </div>
    </div>

        ],
        "Comp: Partnership & Age": [
            { "q": "पिता और पुत्र की वर्तमान आयु का अनुपात 4:1 है। 5 वर्ष बाद यह अनुपात 3:1 हो जाता है, पिता की वर्तमान आयु क्या है?", "options": ["40 वर्ष", "45 वर्ष", "50 वर्ष", "60 वर्ष"], "answer": 0, "fact": "अनुपात विधि से हल करने पर पिता की आयु 40 वर्ष आती है।" }
        ],
        "Comp: Algebra": [
            { "q": "यदि x + 1/x = 4 है, तो x² + 1/x² का मान क्या होगा?", "options": ["14", "16", "12", "10"], "answer": 0, "fact": "शॉर्टकट ट्रिक: k² - 2 => 4² - 2 = 14." }
        ],
        "Comp: Geometry": [
            { "q": "त्रिभुज की भुजाएँ 5cm, 12cm और 13cm हैं, इसका क्षेत्रफल क्या होगा?", "options": ["30 sq cm", "60 sq cm", "25 sq cm", "32.5 sq cm"], "answer": 0, "fact": "क्षेत्रफल = (1/2) × 5 × 12 = 30 sq cm." }
        ],
        "Comp: Mensuration (2D & 3D)": [
            { "q": "यदि किसी वर्ग के विकर्ण को 50% बढ़ा दिया जाए, तो उसके क्षेत्रफल में कितने प्रतिशत की वृद्धि होगी?", "options": ["50%", "100%", "125%", "150%"], "answer": 2, "fact": "सक्सेसिव फॉर्मूला: 50 + 50 + 25 = 125%." }
        ],
        "Comp: Trigonometry": [
            { "q": "sin 15° का मान कितना होता है?", "options": ["(√3-1)/2√2", "(√3+1)/2√2", "1/√2", "√3/2"], "answer": 0, "fact": "sin(45°-30°) के सूत्र से (√3 - 1) / 2√2 होता है।" }
        ],
        "Comp: Coordinate Geometry": [
            { "q": "बिंदुओं (2, 3) और (4, 1) के बीच की दूरी क्या होगी?", "options": ["2√2", "4", "√6", "2"], "answer": 0, "fact": "दूरी सूत्र: √((4-2)² + (1-3)²) = √8 = 2√2." }
        ],
        "Comp: Data Interpretation (DI)": [
            { "q": "यदि किसी पाई चार्ट में कुल मान 360° है और एक सेक्टर का कोण 72° है, तो उसका प्रतिशत क्या है?", "options": ["10%", "15%", "20%", "25%"], "answer": 2, "fact": "(72° / 360°) × 100 = 20%." }
        ],
        "Comp: Sequence & Series": [
            { "q": "समान्तर श्रेणी 2, 5, 8, 11... का 10वाँ पद क्या होगा?", "options": ["29", "32", "35", "28"], "answer": 0, "fact": "Tn = a + (n-1)d => 2 + (10-1)3 = 29." }
        ],
        "Comp: Permutation & Probability": [
            { "q": "एक पासा फेंकने पर 4 से बड़ी संख्या आने की प्रायिकता क्या है?", "options": ["1/6", "1/3", "1/2", "2/3"], "answer": 1, "fact": "प्रायिकता = 2/6 = 1/3." }
        ]
    };

    let currentCategory = "";
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timeLeft = 15;
    let timerInterval;

    const sidebar = document.getElementById("sidebar");
    const compSubmenu = document.getElementById("comp-submenu");
    const quizContainerMain = document.getElementById("quiz-container-main");
    const welcomeMsg = document.getElementById("welcome-msg");
    const scoreCard = document.getElementById("score-card");

    // Populate Sidebar: School classes first, then competitive dropdown
    Object.keys(allQuizData).forEach(category => {
        const btn = document.createElement("button");
        btn.className = "class-btn";
        btn.innerText = category;
        btn.onclick = () => startCategory(category, btn);

        if (category.startsWith("Comp:")) {
            btn.innerText = category.replace("Comp: ", "");
            compSubmenu.appendChild(btn);
        } else {
            // Insert before the Competitive Exams button
            sidebar.insertBefore(btn, document.querySelector(".dropdown-btn"));
        }
    });

    // Toggle Competitive Menu Dropdown
    function toggleCompMenu() {
        if (compSubmenu.style.display === "block") {
            compSubmenu.style.display = "none";
        } else {
            compSubmenu.style.display = "block";
        }
    }

    function startCategory(category, selectedBtn) {
        document.querySelectorAll(".class-btn").forEach(b => b.classList.remove("active"));
        selectedBtn.classList.add("active");

        currentCategory = category;
        currentQuestions = allQuizData[category];
        currentQuestionIndex = 0;
        score = 0;

        welcomeMsg.style.display = "none";
        scoreCard.style.display = "none";
        quizContainerMain.style.display = "block";
        
        document.getElementById("level-badge").innerText = category;
        loadQuestion();
    }

    function startTimer() {
        timeLeft = 15;
        document.getElementById("timer").innerText = `⏱️ ${timeLeft}s`;
        clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = `⏱️ ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeOutAction();
            }
        }, 1000);
    }

    function timeOutAction() {
        const currentQuiz = currentQuestions[currentQuestionIndex];
        const buttons = document.getElementById("options-box").getElementsByTagName("button");

        for (let btn of buttons) btn.disabled = true;
        buttons[currentQuiz.answer].classList.add("correct");

        showExplanation(false, "समय समाप्त! ⌛", currentQuiz.fact);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        startTimer();
        
        const explanationBox = document.getElementById("explanation-box");
        const nextBtn = document.getElementById("next-btn");
        explanationBox.style.display = "none";
        nextBtn.style.display = "none";
        
        document.getElementById("progress-text").innerText = `सवाल: ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
        const currentQuiz = currentQuestions[currentQuestionIndex];
        document.getElementById("question").innerText = `Q. ${currentQuiz.q}`;
        
        const optionsBox = document.getElementById("options-box");
        optionsBox.innerHTML = "";
        currentQuiz.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.innerText = option;
            btn.onclick = () => selectOption(index, btn);
            optionsBox.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, selectedBtn) {
        clearInterval(timerInterval);
        const currentQuiz = currentQuestions[currentQuestionIndex];
        const buttons = document.getElementById("options-box").getElementsByTagName("button");

        for (let btn of buttons) btn.disabled = true;

        if (selectedIndex === currentQuiz.answer) {
            selectedBtn.classList.add("correct");
            score++;
            showExplanation(true, "बिल्कुल सही! 🎯", currentQuiz.fact);
        } else {
            selectedBtn.classList.add("wrong");
            buttons[currentQuiz.answer].classList.add("correct");
            showExplanation(false, "गलत जवाब! ❌", currentQuiz.fact);
        }
    }

    function showExplanation(isCorrect, title, factText) {
        const explanationBox = document.getElementById("explanation-box");
        explanationBox.className = isCorrect ? "correct-bg" : "wrong-bg";
        explanationBox.innerHTML = `<strong>${title}</strong><br>${factText}`;
        explanationBox.style.display = "block";
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            clearInterval(timerInterval);
            quizContainerMain.style.display = "none";
            scoreCard.style.display = "block";
            document.getElementById("final-score").innerText = `आपने ${currentQuestions.length} में से ${score} सवालों के सही जवाब दिए हैं!`;
        }
    }

    function restartCategory() {
        currentQuestionIndex = 0;
        score = 0;
        scoreCard.style.display = "none";
        quizContainerMain.style.display = "block";
        loadQuestion();
    }
</script>

</body>
</html>
