<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Math Quiz - Class Wise</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            color: #333;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background: #1e3c72;
            color: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #2a5298;
            padding-bottom: 10px;
        }
        .class-btn {
            display: block;
            width: 100%;
            background: #2a5298;
            color: white;
            border: none;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            padding-left: 15px;
        }
        .class-btn:hover, .class-btn.active {
            background: #ff9800;
            color: #fff;
            font-weight: bold;
        }

        /* Main Content Styling */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            overflow-y: auto;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }
        .timer {
            background: #ff4757;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
        }
        .level-badge {
            display: inline-block;
            background: #1e3c72;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .question {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #f1f3f5;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: 0.3s;
        }
        .options button:hover:not(:disabled) {
            background: #e2e6ea;
            border-color: #1e3c72;
        }
        .options button.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }
        .options button.wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        /* Explanation Box */
        #explanation-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            border-left: 5px solid #1e3c72;
        }
        .correct-bg { background: #d4edda; border-left-color: #28a745; color: #155724; }
        .wrong-bg { background: #f8d7da; border-left-color: #dc3545; color: #721c24; }

        .next-btn {
            display: none;
            width: 100%;
            padding: 12px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .next-btn:hover { background: #162b50; }
        
        .score-card { text-align: center; display: none; }
        .placeholder-text { text-align: center; color: #666; font-size: 18px; margin-top: 50px; }

        /* Responsive for Mobile */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                display: flex;
                overflow-x: auto;
                padding: 10px;
                white-space: nowrap;
            }
            .sidebar h2 { display: none; }
            .class-btn {
                display: inline-block;
                width: auto;
                margin-right: 10px;
                margin-bottom: 0;
            }
            .main-content { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <div class="sidebar" id="sidebar">
        <h2>📚 Math Levels</h2>
        <!-- Buttons will be generated by JS -->
    </div>

    <!-- Main Quiz Content -->
    <div class="main-content">
        <div class="container" id="quiz-container-main" style="display: none;">
            
            <div class="top-bar">
                <span id="progress-text">सवाल: 1 / 5</span>
                <span class="timer" id="timer">⏱️ 15s</span>
            </div>

            <div id="level-badge" class="level-badge">Class Name</div>
            <div id="question" class="question">सवाल यहाँ लोड हो रहा है...</div>
            
            <div class="options" id="options-box"></div>
            <div id="explanation-box"></div>
            
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">अगला सवाल ➡️</button>
        </div>

        <!-- Initial Placeholder Message -->
        <div class="container" id="welcome-msg">
            <h2 style="color: #1e3c72; text-align: center;">👋 Welcome to Math Hub!</h2>
            <p class="placeholder-text">कृपया बायीं (Left) तरफ से अपनी <b>Class</b> या <b>Level</b> चुनें और क्विज़ शुरू करें।</p>
        </div>

        <!-- Score Card -->
        <div class="container score-card" id="score-card">
            <h2>क्विज़ समाप्त! 🎉</h2>
            <p id="final-score" style="font-size: 18px; margin: 15px 0;"></p>
            <button class="next-btn" style="display: block;" onclick="restartCategory()">दोबारा खेलें 🔄</button>
        </div>
    </div>

<script>
    // Data Base for Questions grouped by Category
    const allQuizData = {
        "Class 1-3": [
            { q: "यदि एक टोकरी में 15 आम हैं और 7 आम और डाल दिए जाएं, तो कुल कितने आम होंगे?", options: ["20", "22", "25", "18"], answer: 1, fact: "15 + 7 = 22. यह साधारण जोड़ (Addition) है।" },
            { q: "9 में से 4 घटाने पर क्या बचेगा?", options: ["4", "6", "5", "3"], answer: 2, fact: "9 - 4 = 5. यह घटाव (Subtraction) का सवाल है।" }
        ],
        "Class 4-6": [
            { q: "12 और 18 का लघुत्तम समापवर्त्य (LCM) क्या होगा?", options: ["24", "36", "72", "6"], answer: 1, fact: "12 और 18 दोनों के पहाड़े में सबसे पहली आम संख्या 36 आती है (12×3=36, 18×2=36)।" },
            { q: "1/2 और 1/4 को जोड़ने पर क्या मिलेगा?", options: ["3/4", "2/4", "1/6", "3/8"], answer: 0, fact: "1/2 (यानी आधा) + 1/4 (यानी चौथाई) = 3/4 होता है।" }
        ],
        "Class 7-8": [
            { q: "यदि A : B = 2 : 3 और B : C = 4 : 5 है, तो A : C क्या होगा?", options: ["8 : 15", "2 : 5", "8 : 12", "6 : 15"], answer: 0, fact: "A/B × B/C = (2/3) × (4/5) = 8/15." },
            { q: "₹1000 पर 10% की दर से 1 वर्ष का साधारण ब्याज क्या होगा?", options: ["₹10", "₹50", "₹100", "₹110"], answer: 2, fact: "साधारण ब्याज = (मूलधन × दर × समय) / 100. (1000 × 10 × 1) / 100 = 100." }
        ],
        "Class 9-10": [
            { q: "एक वस्तु को ₹500 में बेचकर 25% का लाभ कमाया गया, क्रय मूल्य क्या था?", options: ["₹400", "₹450", "₹375", "₹425"], answer: 0, fact: "क्रय मूल्य = (विक्रय मूल्य × 100) / (100 + लाभ%). (500 × 100) / 125 = ₹400." }
        ],
        "Class 11-12 (Algebra)": [
            { q: "यदि x + (1/x) = 3 है, तो x² + (1/x²) का मान क्या होगा?", options: ["7", "9", "6", "11"], answer: 0, fact: "शॉर्टकट ट्रिक! यदि x + (1/x) = k हो, तो x² + (1/x²) हमेशा (k² - 2) होता है। (3² - 2) = 7." }
        ],
        "Competitive Exams": [
            { q: "यदि कोई ट्रेन 72 किमी/घंटा की गति से चल रही है, तो उसकी गति मीटर/सेकंड (m/s) में क्या होगी?", options: ["20 m/s", "15 m/s", "18 m/s", "25 m/s"], answer: 0, fact: "किमी/घंटा को m/s में बदलने के लिए 5/18 से गुणा करते हैं। 72 × (5/18) = 20 m/s." },
            { q: "A किसी काम को 10 दिन में और B उसी काम को 15 दिन में करता है। दोनों मिलकर उस काम को कितने दिन में करेंगे?", options: ["5 दिन", "6 दिन", "8 दिन", "12 दिन"], answer: 1, fact: "ट्रिक: (A×B)/(A+B) = (10×15)/(10+15) = 150/25 = 6 दिन।" }
        ]
    };

    let currentCategory = "";
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timeLeft = 15;
    let timerInterval;

    const sidebar = document.getElementById("sidebar");
    const quizContainerMain = document.getElementById("quiz-container-main");
    const welcomeMsg = document.getElementById("welcome-msg");
    const scoreCard = document.getElementById("score-card");

    // Generate Sidebar Buttons
    Object.keys(allQuizData).forEach(category => {
        const btn = document.createElement("button");
        btn.className = "class-btn";
        btn.innerText = category;
        btn.onclick = () => startCategory(category, btn);
        sidebar.appendChild(btn);
    });

    function startCategory(category, selectedBtn) {
        // Highlight active button
        document.querySelectorAll(".class-btn").forEach(b => b.classList.remove("active"));
        selectedBtn.classList.add("active");

        currentCategory = category;
        currentQuestions = allQuizData[category];
        currentQuestionIndex = 0;
        score = 0;

        welcomeMsg.style.display = "none";
        scoreCard.style.display = "none";
        quizContainerMain.style.display = "block";
        
        document.getElementById("level-badge").innerText = category;
        loadQuestion();
    }

    function startTimer() {
        timeLeft = 15;
        document.getElementById("timer").innerText = `⏱️ ${timeLeft}s`;
        clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = `⏱️ ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeOutAction();
            }
        }, 1000);
    }

    function timeOutAction() {
        const currentQuiz = currentQuestions[currentQuestionIndex];
        const buttons = document.getElementById("options-box").getElementsByTagName("button");

        for (let btn of buttons) btn.disabled = true;
        buttons[currentQuiz.answer].classList.add("correct");

        showExplanation(false, "समय समाप्त! ⌛", currentQuiz.fact);
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        startTimer();
        
        const explanationBox = document.getElementById("explanation-box");
        const nextBtn = document.getElementById("next-btn");
        explanationBox.style.display = "none";
        nextBtn.style.display = "none";
        
        document.getElementById("progress-text").innerText = `सवाल: ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
        const currentQuiz = currentQuestions[currentQuestionIndex];
        document.getElementById("question").innerText = `Q. ${currentQuiz.q}`;
        
        const optionsBox = document.getElementById("options-box");
        optionsBox.innerHTML = "";
        currentQuiz.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.innerText = option;
            btn.onclick = () => selectOption(index, btn);
            optionsBox.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, selectedBtn) {
        clearInterval(timerInterval);
        const currentQuiz = currentQuestions[currentQuestionIndex];
        const buttons = document.getElementById("options-box").getElementsByTagName("button");

        for (let btn of buttons) btn.disabled = true;

        if (selectedIndex === currentQuiz.answer) {
            selectedBtn.classList.add("correct");
            score++;
            showExplanation(true, "बिल्कुल सही! 🎯", currentQuiz.fact);
        } else {
            selectedBtn.classList.add("wrong");
            buttons[currentQuiz.answer].classList.add("correct");
            showExplanation(false, "गलत जवाब! ❌", currentQuiz.fact);
        }
    }

    function showExplanation(isCorrect, title, factText) {
        const explanationBox = document.getElementById("explanation-box");
        explanationBox.className = isCorrect ? "correct-bg" : "wrong-bg";
        explanationBox.innerHTML = `<strong>${title}</strong><br>${factText}`;
        explanationBox.style.display = "block";
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            clearInterval(timerInterval);
            quizContainerMain.style.display = "none";
            scoreCard.style.display = "block";
            document.getElementById("final-score").innerText = `आपने ${currentQuestions.length} में से ${score} सवालों के सही जवाब दिए हैं!`;
        }
    }

    function restartCategory() {
        currentQuestionIndex = 0;
        score = 0;
        scoreCard.style.display = "none";
        quizContainerMain.style.display = "block";
        loadQuestion();
    }
</script>

</body>
</html>
